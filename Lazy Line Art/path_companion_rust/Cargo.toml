[package]
name = "lazy-path-companion"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "lazy-path-companion"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "=0.25.6", default-features = false, features = ["png"] }
rayon = "1.11.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1

